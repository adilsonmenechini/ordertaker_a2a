services:
  # ── Backend Agents ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${FILA_PORT:-9001}:9001"
      - "${COZINHA_PORT:-9002}:9002"
      - "${PREPARO_PORT:-9003}:9003"
      - "${ENTREGA_PORT:-9004}:9004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - FILA_PORT=${FILA_PORT:-9001}
      - COZINHA_PORT=${COZINHA_PORT:-9002}
      - PREPARO_PORT=${PREPARO_PORT:-9003}
      - ENTREGA_PORT=${ENTREGA_PORT:-9004}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pastel-net

  # ── Frontend (Next.js + CopilotKit) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FILA_AGENT_URL=http://backend:${FILA_PORT:-9001}
        - NEXT_PUBLIC_COZINHA_AGENT_URL=http://backend:${COZINHA_PORT:-9002}
        - NEXT_PUBLIC_PREPARO_AGENT_URL=http://backend:${PREPARO_PORT:-9003}
        - NEXT_PUBLIC_ENTREGA_AGENT_URL=http://backend:${ENTREGA_PORT:-9004}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FILA_AGENT_URL=http://backend:${FILA_PORT:-9001}
      - COZINHA_AGENT_URL=http://backend:${COZINHA_PORT:-9002}
      - PREPARO_AGENT_URL=http://backend:${PREPARO_PORT:-9003}
      - ENTREGA_AGENT_URL=http://backend:${ENTREGA_PORT:-9004}
      - ORCHESTRATOR_URL=http://backend:${FILA_PORT:-9001}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pastel-net

networks:
  pastel-net:
    driver: bridge
